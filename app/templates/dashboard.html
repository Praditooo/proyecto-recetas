{% extends "base.html" %}
{% block title %}Mi cocina{% endblock %}
{% block nav %}<button id="logout" class="secondary" type="button">Cerrar sesión</button>{% endblock %}
{% block content %}
<section class="grid-2 top">
  <div class="panel">
    <h2>Mi inventario</h2>
    <form id="ingredient-form" class="inline-form">
      <label>Ingrediente <input type="text" name="name" required maxlength="100" placeholder="ej. Tomate, Arroz, Leche"></label>
      <label>Cantidad <input type="number" name="quantity" required min="0.01" step="any" placeholder="ej. 500"></label>
      <label>Unidad <input type="text" name="unit" value="unidad" required maxlength="20"></label>
      <button type="submit">Agregar ingrediente</button>
    </form>
    <label>Buscar ingrediente <input type="text" id="ingredient-search" placeholder="Escribe para buscar..." maxlength="100"></label>
    <ul id="ingredients" class="rows"></ul>
  </div>
  <div class="panel">
    <h2>Nueva receta</h2>
    <p>Usaremos todo lo que está en tu inventario.</p>
    <form id="generate-form" class="options-form">
      <label>Dieta
        <select name="diet">
          <option value="">Sin preferencia</option>
          <option value="vegetariana">Vegetariana</option>
          <option value="vegana">Vegana</option>
          <option value="sin gluten">Sin gluten</option>
          <option value="sin lactosa">Sin lactosa</option>
        </select>
      </label>
      <label>Tiempo máximo (min) <input type="number" name="max_minutes" min="5" max="1440" step="1" placeholder="Opcional"></label>
      <label>Porciones <input type="number" name="servings" min="1" max="20" step="1" placeholder="Opcional"></label>
      <button id="generate" type="submit">Generar receta</button>
    </form>
  </div>
</section>
<h2>Mis recetas</h2>
<form id="history-filters" class="filters-form">
  <label>Buscar <input type="search" name="q" maxlength="100" placeholder="Nombre del plato"></label>
  <label>Dificultad
    <select name="difficulty">
      <option value="">Todas</option>
      <option value="Fácil">Fácil</option>
      <option value="Media">Media</option>
      <option value="Difícil">Difícil</option>
    </select>
  </label>
  <label>Calificación
    <select name="min_rating">
      <option value="">Todas</option>
      <option value="5">★★★★★</option>
      <option value="4">★★★★ o más</option>
      <option value="3">★★★ o más</option>
      <option value="2">★★ o más</option>
      <option value="1">★ o más</option>
    </select>
  </label>
  <label>Ordenar por
    <select name="sort">
      <option value="recent">Más recientes</option>
      <option value="rating">Mejor calificadas</option>
    </select>
  </label>
</form>
<p id="recipes-count" class="meta"></p>
<div id="recipes" class="recipes"></div>
<button id="recipes-more" class="secondary" type="button" hidden>Ver más recetas</button>
{% endblock %}
{% block scripts %}
<script src="/static/js/inventory.js"></script>
<script src="/static/js/recipes.js"></script>
<script>
  if (!token()) { location.href = "/"; }
  else {
    document.getElementById("logout").addEventListener("click", logout);
    initInventory();
    initRecipes();
  }
</script>
{% endblock %}
